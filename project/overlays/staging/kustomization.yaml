apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging: every commit to main. Broadcaster only logs, it does not forward;
# the database is not backed up here (no backup CronJob in this overlay).
namespace: project-staging
resources:
- ../../base
- namespace.yaml
# Patches are evaluated before the namespace transformer above, so their targets
# use the namespace the manifests already carry (project).
patches:
- path: broadcaster-log-only.yaml
  target:
    kind: Deployment
    name: broadcaster
    namespace: project
- target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: project
    namespace: project
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: staging.project.local

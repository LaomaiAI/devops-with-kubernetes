apiVersion: apps/v1
kind: Deployment
metadata:
  name: project
  namespace: project
  labels:
    app: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project
  template:
    metadata:
      labels:
        app: project
    spec:
      containers:
        - name: project
          image: project:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: project-config
          volumeMounts:
            - name: project-files
              mountPath: /usr/src/app/files
      volumes:
        - name: project-files
          persistentVolumeClaim:
            claimName: project-files

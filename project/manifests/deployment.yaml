apiVersion: apps/v1
kind: Deployment
metadata:
  name: project
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project
  template:
    metadata:
      labels:
        app: project
    spec:
      containers:
        - name: project
          image: project:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: IMAGE_PATH
              value: "/usr/src/app/files/image.jpg"
            - name: IMAGE_CACHE_MS
              value: "600000"
            - name: TODO_BACKEND_URL
              value: http://todo-backend/todos
          volumeMounts:
            - name: project-files
              mountPath: /usr/src/app/files
      volumes:
        - name: project-files
          persistentVolumeClaim:
            claimName: project-files

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-production
  namespace: argocd
spec:
  destination:
    namespace: project
    server: https://kubernetes.default.svc
  project: default
  source:
    path: project/overlays/production
    repoURL: https://github.com/LaomaiAI/devops-with-kubernetes.git
    targetRevision: '4.9'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

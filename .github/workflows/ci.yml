name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: node --check log-output/index.js && node --check project/index.js && node --check pingpong/index.js && node --check project/todo-backend/index.js
      - name: Build Docker images
        run: docker build -t log-output:test log-output && docker build -t project:test project && docker build -t pingpong:test pingpong && docker build -t todo-backend:test project/todo-backend

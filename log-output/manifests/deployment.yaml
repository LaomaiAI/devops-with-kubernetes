apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
  labels:
    app: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output-writer
          image: log-output:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3000"
            - name: MODE
              value: writer
            - name: FILE_PATH
              value: /usr/src/app/files/log.txt
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/files
        - name: log-output-reader
          image: log-output:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MODE
              value: reader
            - name: FILE_PATH
              value: /usr/src/app/files/log.txt
            - name: PINGPONG_URL
              value: http://pingpong/count
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/files
      volumes:
        - name: shared-files
          emptyDir: {}

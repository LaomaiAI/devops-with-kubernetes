apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-k3s-default-agent-0
      containers:
        - name: log-output-writer
          image: log-output:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: "writer"
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/files
        - name: log-output-reader
          image: log-output:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: MODE
              value: "reader"
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/files
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-files

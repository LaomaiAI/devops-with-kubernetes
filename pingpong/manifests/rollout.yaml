apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: pingpong
  namespace: exercises
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: pingpong-cpu-usage
        - setWeight: 100
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
        - name: pingpong
          image: pingpong:latest
          imagePullPolicy: Never
          readinessProbe:
            httpGet:
              path: /count
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: pingpong-config
            - secretRef:
                name: pingpong-db-secret

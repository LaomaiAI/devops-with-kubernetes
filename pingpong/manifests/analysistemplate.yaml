apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: pingpong-cpu-usage
  namespace: exercises
spec:
  metrics:
    - name: cpu-usage
      interval: 10s
      count: 1
      initialDelay: 30s
      successCondition: result[0] <= 0.05
      failureLimit: 0
      provider:
        prometheus:
          address: http://prom-prometheus-server.monitoring.svc.cluster.local
          query: |
            sum(rate(container_cpu_usage_seconds_total{namespace="exercises"}[5m]))

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pingpong-db
  namespace: exercises
  labels:
    app: pingpong-db
spec:
  serviceName: pingpong-db
  replicas: 1
  selector:
    matchLabels:
      app: pingpong-db
  template:
    metadata:
      labels:
        app: pingpong-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: pingpong-db-secret
          volumeMounts:
            - name: pingpong-db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pingpong-db-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi

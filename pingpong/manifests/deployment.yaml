apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-k3s-default-agent-0
      containers:
        - name: pingpong
          image: pingpong:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: COUNT_PATH
              value: "/usr/src/app/files/pingpong.txt"
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/files
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-files
